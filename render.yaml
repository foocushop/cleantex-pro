services:
  - type: web
    name: cleantex-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        generateValue: false
        value: 2026
      - key: PORT
        value: 10000
    disk:
      name: cleantex-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
