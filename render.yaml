services:
  - type: web
    name: cleantex-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        value: 2026
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: foocushop/cleantex-pro
      - key: GITHUB_BRANCH
        value: main
