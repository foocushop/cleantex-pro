<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CleanTex Pro | Acces Gerant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #0b1a2b; color: #f0f5fa; overflow-x: hidden;
    }
    .login-page {
      min-height: 100svh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,187,166,0.15) 0%, transparent 70%), #0b1a2b;
    }
    .login-card {
      background: #13273d; border: 1px solid #1f3d5c; border-radius: 24px;
      padding: 44px 40px; width: 100%; max-width: 400px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5); text-align: center;
    }
    .login-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #00bba6 0%, #007a6d 100%);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,187,166,0.4);
    }
    .login-logo-text { font-size: 1.5rem; font-weight: 800; color: #ffffff; }
    .login-logo-text span { color: #00bba6; }
    .login-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,187,166,0.12); border: 1px solid rgba(0,187,166,0.3);
      color: #00bba6; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 999px; margin-bottom: 20px;
    }
    .login-title { font-size: 1.55rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
    .login-subtitle { font-size: 0.92rem; color: #7b8a9e; margin-bottom: 32px; }
    .pin-label { display: block; font-size: 0.85rem; font-weight: 700; color: #c0cfe0; text-align: left; margin-bottom: 8px; }
    .pin-input {
      width: 100%; padding: 15px 18px; font-size: 1.35rem;
      font-family: 'Courier New', monospace; font-weight: 700;
      letter-spacing: 0.25em; background: #0d1f30;
      border: 1.5px solid #234162; border-radius: 12px; color: #ffffff;
      text-align: center; transition: all 0.2s ease; outline: none; margin-bottom: 20px;
    }
    .pin-input:focus { border-color: #00bba6; box-shadow: 0 0 0 4px rgba(0,187,166,0.2); background: #0f2437; }
    .pin-input.error { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.2); animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
    }
    .login-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #00bba6 0%, #009e8c 100%);
      color: #ffffff; font-size: 1rem; font-weight: 800;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.22s ease; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,187,166,0.4); margin-bottom: 12px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,187,166,0.5); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; font-size: 0.88rem; font-weight: 600;
      padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; display: none;
    }
    .error-msg.visible { display: block; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; font-size: 0.86rem; font-weight: 600;
      text-decoration: none; transition: color 0.2s ease; margin-top: 6px;
    }
    .back-link:hover { color: #00bba6; }
    @media (max-width: 480px) { .login-card { padding: 32px 22px; } .login-title { font-size: 1.35rem; } }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="login-logo-text">CleanTex<span>Pro</span></div>
      </div>
      <div class="login-badge">🔐 Espace Gerant</div>
      <h1 class="login-title">Acces Reserve</h1>
      <p class="login-subtitle">Saisissez votre code PIN pour acceder au tableau de bord de reception des demandes.</p>
      <label class="pin-label" for="pinInput">🔑 Code PIN</label>
      <input type="password" id="pinInput" class="pin-input" placeholder="• • • •" maxlength="20" autocomplete="current-password" inputmode="numeric">
      <div class="error-msg" id="errorMsg">❌ Code PIN incorrect. Verifiez votre code et reessayez.</div>
      <button class="login-btn" id="loginBtn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Acceder au tableau de bord
      </button>
      <a href="/" class="back-link">← Retour au site client</a>
    </div>
  </div>
  <script>
    const pinInput = document.getElementById('pinInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    pinInput.focus();
    pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
    loginBtn.addEventListener('click', attemptLogin);
    async function attemptLogin() {
      const pin = pinInput.value.trim();
      if (!pin) { showError(); return; }
      loginBtn.disabled = true;
      loginBtn.textContent = 'Verification...';
      errorMsg.classList.remove('visible');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.success && data.token) {
          const expires = new Date(Date.now() + 8 * 60 * 60 * 1000).toUTCString();
          document.cookie = 'cleantex_admin_token=' + encodeURIComponent(data.token) + '; expires=' + expires + '; path=/; SameSite=Strict';
          loginBtn.textContent = 'Connexion reussie...';
          loginBtn.style.background = 'linear-gradient(135deg, #059669, #047857)';
          setTimeout(() => { window.location.href = '/admin'; }, 400);
        } else {
          showError();
          resetBtn();
        }
      } catch (err) {
        showError();
        resetBtn();
      }
    }
    function showError() {
      pinInput.classList.add('error'); errorMsg.classList.add('visible');
      pinInput.value = ''; pinInput.focus();
      setTimeout(() => pinInput.classList.remove('error'), 600);
    }
    function resetBtn() {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Acceder au tableau de bord';
    }
  </script>
</body>
</html>
